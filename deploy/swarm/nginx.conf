# nginx server block baked into the image (Dockerfile) — serves the site behind
# the Cloudflare Tunnel. Cloudflare owns TLS; this only ever speaks plain HTTP
# on the overlay network, so there is no listen 443 and no certbot.
#
# nginx footgun: an `add_header` INSIDE a location silently drops every
# server-level `add_header` for that location. Caching below therefore uses
# `expires`, which does not trigger that, so the security headers apply to
# every response.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # cloudflared reaches this as http://web:80 — a trailing-slash redirect
    # must stay relative or the browser is sent to http://web/.
    absolute_redirect off;

    # Default: revalidate every time, so a redeploy is seen immediately.
    # `expires epoch` -> `Cache-Control: no-cache`. Set at server level, not on
    # `location = /`: `index` internally redirects / to /index.html, which lands
    # in `location /`, so a rule on `= /` never applies to the page itself.
    expires epoch;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    # 'unsafe-inline' is not a hedge: the pages carry inline <script> and
    # style= attributes (index, about, bartium, mp18, voxel-shader). What the
    # policy still buys is the origin list — no third-party script origin at
    # all, and exactly the three embed origins the portfolio uses. img-src
    # stays broad (https:) because a few project pages hotlink stills; a
    # tighter value would blank them.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; media-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-src https://www.youtube.com https://sketchfab.com https://player.vimeo.com; base-uri 'none'; frame-ancestors 'none'" always;

    # One canonical URL per page. `try_files $uri $uri.html` below means
    # /about, /about.html and (for the home page) /, /index.html all answer
    # 200 — GitHub Pages served the same three shapes, so both are already
    # out there. 301 the .html forms at the edge of the app instead of adding
    # a rel=canonical to every file: it consolidates what is already indexed
    # and needs no edit to the site's HTML.
    #
    # Matching on $request_uri, not $uri, is what keeps this from looping:
    # try_files rewrites $uri to /about.html internally, while $request_uri
    # stays whatever the browser actually asked for.
    if ($request_uri ~ "^/(.*/)?index\.html") { return 301 /$1$is_args$args; }
    if ($request_uri ~ "^(.*)\.html")         { return 301 $1$is_args$args; }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain;

    # Big, never-edited media and downloads. Not content-hashed, so a week —
    # long enough to matter for 108 MB of video, short enough that replacing a
    # file does not need a cache purge to be seen.
    location ~* \.(jpe?g|png|gif|svg|ico|webp|mp4|webm|woff2?|pdf|zip|fx)$ {
        expires 7d;
    }

    # GitHub Pages served this site and resolves /about -> about.html; every
    # internal link in the HTML is extensionless (href="about", href="f14").
    # Without $uri.html the whole site 404s on migration — this line IS the
    # migration.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
